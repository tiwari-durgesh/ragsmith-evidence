[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ragsmith-evidence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.26.5", "python-docx==1.2.0", "openpyxl==3.1.5", "beautifulsoup4==4.14.2"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[project.scripts]
ragsmith = "ragsmith.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
